[font]
normal = { family = "JetBrains Mono", style = "Regular" }
size = 11.0

[colors.primary]
background = '#FFFFFF'
foreground = '#000000'

[colors.normal]
black   = '#5c5e5a'
red     = '#d3007a'
green   = '#5a9216'
yellow  = '#c26400'
blue    = '#7c4dff'
magenta = '#d3007a'
cyan    = '#0090a8'
white   = '#e6e6e0'

[colors.bright]
black   = '#8a8a7a'
red     = '#f4005f'
green   = '#7cad1a'
yellow  = '#e0a52f'
